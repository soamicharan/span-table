[project]
name = "span-table"
version = "0.1.0"
description = "span-table is a lightweight Python helper for rendering ASCII tables with merged cells using Rich-style markup."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=15.0.0",
]
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Soami Charan", email = "charansoami@gmail.com" }]
maintainers = [{ name = "Soami Charan", email = "charansoami@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["table", "ascii", "rich", "span", "merged cells"]

[project.urls]
Repository = "https://github.com/soamicharan/span-table"
Homepage = "https://github.com/soamicharan/span-table"
Issues = "https://github.com/soamicharan/span-table/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/span_table"]